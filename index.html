<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karachi Cafe - AR Menu</title>
    <!-- Google Model Viewer Script (Yeh 3D chalata hai) -->
    <script type="module" src="https://googleapis.com"></script>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f8f9fa; padding: 20px; }
        .menu-card { background: white; padding: 15px; margin: 15px auto; max-width: 400px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn-ar { background-color: #ff4757; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        model-viewer { width: 100%; height: 250px; background-color: #eee; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🍔 ABC CAFE MENU 🍟</h1>
    <p>Apna manpasand khana 3D aur AR mein dekhein</p>

    <!-- Item 1: Burger -->
    <div class="menu-card">
        <h3>1. Special Zinger Burger</h3>
        <p>Price: 450 PKR</p>
        
        <!-- Google 3D Viewer Inside the Menu -->
        <model-viewer src="models/burger.glb" ios-src="models/burger.usdz" ar camera-controls touch-action="none">
            <button slot="ar-button" class="btn-ar">✨ View on Table (AR)</button>
        </model-viewer>
    </div>

    <!-- Item 2: Pizza Slice -->
    <div class="menu-card">
        <h3>2. Chicken Tikka Pizza Slice</h3>
        <p>Price: 350 PKR</p>
        
        <model-viewer src="models/pizza.glb" ios-src="models/pizza.usdz" ar camera-controls touch-action="none">
            <button slot="ar-button" class="btn-ar">✨ View on Table (AR)</button>
        </model-viewer>
    </div>

</body>
</html>
