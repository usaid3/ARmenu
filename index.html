<style>
        body {
            background-color: #020408;
            color: #e2e2e8;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);

        .glass-panel-elevated {

            border: 1px solid rgba(255, 255, 255, 0.15);

        .neon-text {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5), 0 0 20px rgba(0, 240, 255, 0.3);
        }
        .neon-border:focus-within {
            border-color: #00dbe9;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.2), 0 0 10px rgba(0, 240, 255, 0.2);
        }
        .btn-neon {
            background: linear-gradient(135deg, #00dbe9 0%, #00f0ff 100%);
            color: #002022;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transition: all 0.2s ease-in-out;
        }
        .btn-neon:hover {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
        }
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0,240,255,0.05) 0%, rgba(2,4,8,0) 70%);
            top: -200px;
            right: -200px;
            z-index: -1;
            pointer-events: none;
        }
        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #00dbe9;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }
        /* Toggle Switch */
        .toggle-switch {
            appearance: none;
            width: 32px;
            height: 18px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9px;
            position: relative;
            cursor: pointer;
            outline: none;
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .toggle-switch:checked {
            background: #00dbe9;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        .toggle-switch:checked::after {
            transform: translateX(14px);
        }
        .disabled-field {
            opacity: 0.4;
            pointer-events: none;
        }
          </style>

<!-- Main Content -->

<form class="space-y-md" id="calcForm">

<input class="w-full bg-surface-container/50 border border-white/10 rounded-lg px-md py-sm text-data-mono font-data-mono text-on-surface focus:outline-none" id="risk" step="0.1" type="number" value="36.9"/>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Entry Price -->

<script>
        // Vanilla JS Logic
        document.addEventListener('DOMContentLoaded', () => {
            const leverageInput = document.getElementById('leverage');
            const leverageVal = document.getElementById('leverageVal');
            const calcBtn = document.getElementById('calcBtn');
            const saveBtn = document.getElementById('saveBtn');
            
            const lotSizeToggle = document.getElementById('lotSizeToggle');
            const leverageToggle = document.getElementById('leverageToggle');
            const lotSizeInput = document.getElementById('lotSize');

            // Load toggle states from localStorage
            const savedLotSizeState = localStorage.getItem('lotSizeToggle');
            const savedLeverageState = localStorage.getItem('leverageToggle');

            if (savedLotSizeState !== null) lotSizeToggle.checked = savedLotSizeState === 'true';
            if (savedLeverageState !== null) leverageToggle.checked = savedLeverageState === 'true';

            // Function to update UI based on toggles
            const updateToggleUI = () => {
                if (lotSizeToggle.checked) {
                    lotSizeInput.classList.remove('disabled-field');
                    lotSizeInput.removeAttribute('disabled');
                } else {
                    lotSizeInput.classList.add('disabled-field');
                    lotSizeInput.setAttribute('disabled', 'true');
                }

                if (leverageToggle.checked) {
                    leverageInput.classList.remove('disabled-field');
                    leverageInput.removeAttribute('disabled');
                    leverageVal.classList.remove('opacity-50');
                    leverageVal.textContent = `${leverageInput.value}x`;
                } else {
                    leverageInput.classList.add('disabled-field');
                    leverageInput.setAttribute('disabled', 'true');
                    leverageVal.classList.add('opacity-50');
                    leverageVal.textContent = `1x`;
                }

                localStorage.setItem('lotSizeToggle', lotSizeToggle.checked);
                localStorage.setItem('leverageToggle', leverageToggle.checked);
            };

            // Event Listeners for Toggles
            lotSizeToggle.addEventListener('change', updateToggleUI);
            leverageToggle.addEventListener('change', updateToggleUI);

            // Initial UI Update
            updateToggleUI();

            // Update Leverage Label & correct input
            leverageInput.addEventListener('input', (e) => {
                let val = parseInt(e.target.value);
                if (val > 500) {
                    val = 500;
                    e.target.value = 500;
                }
                if (leverageToggle.checked) {
                    leverageVal.textContent = `${val}x`;
                }
            });

            // Calculate Logic
            calcBtn.addEventListener('click', () => {
                const capital = parseFloat(document.getElementById('capital').value);
                const riskPct = parseFloat(document.getElementById('risk').value);
                const entry = parseFloat(document.getElementById('entry').value);
                let lotSize = parseFloat(lotSizeInput.value);
                let leverage = parseFloat(leverageInput.value);

                // Handle disabled states
                if (!lotSizeToggle.checked) lotSize = 1; // Exclude from calc / set to default
                if (!leverageToggle.checked) leverage = 1;

                if(!capital || !riskPct || !entry || (!lotSize && lotSizeToggle.checked)) {
                    alert("Please fill all required fields");
                    return;
                }

                // Simplified Calculation (For demonstration)
                // Risk Amount
                const riskAmount = capital * (riskPct / 100);
                
                // SL Distance = Risk Amount / (LotSize * StandardContract * Leverage factor approx)
                // For simplified demo, we use a synthetic formula:
                const slDistance = (riskAmount) / (lotSize * leverage * 10);
                
                // Assuming Long position
                const stopLoss = entry - slDistance;
                const takeProfit = entry + (slDistance * 3); // 1:3 Risk Reward

                // Update UI
                document.getElementById('resRiskAmt').textContent = `$${riskAmount.toFixed(2)}`;
                document.getElementById('resSL').textContent = stopLoss.toFixed(5);
                document.getElementById('resSL').classList.add('neon-text');
                document.getElementById('resTP').textContent = takeProfit.toFixed(5);
                document.getElementById('resTP').classList.add('neon-text');
                
                // Slight animation
                const resultPanel = document.querySelector('.glass-panel-elevated');
                resultPanel.style.transform = 'scale(1.02)';
                setTimeout(() => resultPanel.style.transform = 'scale(1)', 200);
            });

            // Save History Logic
            saveBtn.addEventListener('click', () => {
                const entry = document.getElementById('entry').value;
                const sl = document.getElementById('resSL').textContent;
                const tp = document.getElementById('resTP').textContent;

                if(sl === '--') return;

                const setup = { entry, sl, tp, date: new Date().toISOString() };
                let history = JSON.parse(localStorage.getItem('usaid_history')) || [];
                history.push(setup);
                localStorage.setItem('usaid_history', JSON.stringify(history));
                
                saveBtn.innerHTML = '<span class="material-symbols-outlined text-sm" style="font-size: 16px;">check</span> Saved';
                setTimeout(() => {
                    saveBtn.innerHTML = '<span class="material-symbols-outlined text-sm" style="font-size: 16px;">bookmark</span> Save Setup';
                }, 2000);
            });
        });
    </script>
