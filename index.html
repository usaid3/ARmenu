<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chai Dosti — Premium Digital Menu</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;700;900&display=swap');

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-primary: #0a0a0a;
  --gold: #d4a853;
  --gold-bright: #f0c96e;
  --gold-dim: #8a6d2b;
  --text-primary: #f5f0e8;
  --text-secondary: #b8b0a0;
  --card-radius: 28px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
  transition: background 1s ease;
}

/* ━━━ OPTIMIZED: Static bg-glow instead of blur ━━━ */
#bg-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  transition: background 1.2s ease;
  will-change: background;
}

/* REMOVED: #bg-glow with 120px blur — replaced with simple radial gradient */
#bg-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.12;
  transition: background 1.2s ease;
  will-change: opacity;
}

.app-container {
  position: relative;
  z-index: 1;
  padding: 20px 0;
}

.category-section {
  padding: 30px 0 50px;
  position: relative;
}

.category-header {
  padding: 0 40px 20px;
}

.category-title {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-style: italic;
  font-size: clamp(1.8rem, 4vw, 3rem);
  color: var(--text-primary);
  letter-spacing: 1px;
  text-transform: uppercase;
  position: relative;
  display: inline-block;
}

.category-title::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 0;
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, var(--gold), transparent);
  border-radius: 2px;
}

.category-subtitle {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-top: 14px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.carousel-wrapper { position: relative; width: 100%; }

.carousel-track {
  display: flex;
  gap: 30px;
  padding: 40px 40px 60px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  cursor: grab;
  align-items: center;
  min-height: 420px;
}

.carousel-track::-webkit-scrollbar { display: none; }
.carousel-track.grabbing { cursor: grabbing; }

.carousel-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1.5px solid var(--gold-dim);
  background: rgba(10, 10, 10, 0.85);
  color: var(--gold);
  font-size: 18px;
  cursor: pointer;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}

.carousel-nav:hover {
  background: rgba(212, 168, 83, 0.15);
  border-color: var(--gold);
  box-shadow: 0 0 12px rgba(212, 168, 83, 0.4);
  transform: translateY(-50%) scale(1.1);
}

.carousel-nav.prev { left: 8px; }
.carousel-nav.next { right: 8px; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CARD — OPTIMIZED NEON SYSTEM
   
   KEY CHANGES FOR PERFORMANCE:
   1. NO infinite background-position animation
   2. border-image instead of pseudo-element gradient
   3. box-shadow ONLY on active/hover (not always)
   4. will-change added for GPU compositing
   5. NO backdrop-filter (removed glassmorphism)
   6. NO filter: blur() on cards
   7. Simpler transitions
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

.menu-card {
  flex: 0 0 300px;
  height: 380px;
  border-radius: var(--card-radius);
  position: relative;
  scroll-snap-align: center;
  cursor: pointer;
  transform: scale(0.88);
  opacity: 0.55;
  transition: transform 0.4s ease, opacity 0.4s ease;
  will-change: transform, opacity;
  /* ━━━ OPTIMIZED NEON BORDER: Simple solid + single box-shadow ━━━ */
  border: 2px solid var(--gold-dim);
  overflow: visible;
}

.menu-card.active {
  transform: scale(1);
  opacity: 1;
  border-color: var(--gold);
  /* ━━━ ONLY 1 box-shadow layer, smaller blur ━━━ */
  box-shadow: 0 0 15px rgba(212, 168, 83, 0.4),
              0 0 30px rgba(212, 168, 83, 0.15);
}

.menu-card:hover {
  transform: scale(1.03) translateY(-8px);
  opacity: 1;
  border-color: var(--gold-bright);
  box-shadow: 0 0 20px rgba(212, 168, 83, 0.5),
              0 0 35px rgba(212, 168, 83, 0.2);
}

/* ━━━ REMOVED: .card-border-glow pseudo element ━━━ */
/* ━━━ REMOVED: @keyframes borderShimmer (infinite gradient animation) ━━━ */
/* ━━━ REMOVED: @keyframes borderPulse ━━━ */
/* ━━━ REMOVED: .card-aura with filter: blur(60px) ━━━ */
/* ━━━ REMOVED: .card-glass with backdrop-filter ━━━ */
/* ━━━ REMOVED: .card-shimmer with animation ━━━ */

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: var(--card-radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 24px 22px;
}

.card-bg {
  position: absolute;
  inset: 0;
  border-radius: var(--card-radius);
}

/* ━━━ OPTIMIZED: Simple dark overlay instead of backdrop-filter ━━━ */
.card-overlay {
  position: absolute;
  inset: 0;
  border-radius: var(--card-radius);
  background: linear-gradient(180deg,
    rgba(0,0,0,0.05) 0%,
    rgba(0,0,0,0.25) 40%,
    rgba(0,0,0,0.7) 100%
  );
}

.card-content {
  position: relative;
  z-index: 2;
}

.card-title {
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: 1.3rem;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.3);
  margin-bottom: 10px;
  line-height: 1.2;
}

/* ━━━ OPTIMIZED 3D TITLE: No backdrop-filter, simpler bg ━━━ */
.card-title-3d {
  position: absolute;
  top: -55px;
  left: 0;
  right: 0;
  z-index: 10;
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: 1.1rem;
  color: #fff;
  text-align: center;
  text-shadow:
    0 1px 0 rgba(255,255,255,0.1),
    0 2px 0 rgba(0,0,0,0.15),
    0 3px 0 rgba(0,0,0,0.12),
    0 4px 0 rgba(0,0,0,0.1),
    0 5px 8px rgba(0,0,0,0.35),
    0 0 20px rgba(212, 168, 83, 0.25);
  letter-spacing: 1px;
  line-height: 1.3;
  padding: 8px 12px;
  background: rgba(0,0,0,0.65);
  border-radius: 16px 16px 0 0;
  border: 1px solid rgba(212, 168, 83, 0.2);
  border-bottom: none;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none;
}

.menu-card.active .card-title-3d,
.menu-card:hover .card-title-3d {
  opacity: 1;
  transform: translateY(0);
}

.card-desc {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 0.78rem;
  color: rgba(255,255,255,0.8);
  line-height: 1.6;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-price {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 1.2rem;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold), var(--gold-dim));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ━━━ OPTIMIZED SHIMMER: Only on hover, simple transform ━━━ */
.card-shine {
  position: absolute;
  top: 0; left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg,
    transparent,
    rgba(255,255,255,0.06),
    transparent
  );
  z-index: 3;
  pointer-events: none;
  border-radius: var(--card-radius);
  will-change: transform;
}

.menu-card:hover .card-shine {
  animation: shineSlide 0.8s ease forwards;
}

@keyframes shineSlide {
  to { left: 150%; }
}

/* ━━━ NEON PULSE: ONLY on active card, CSS only, lightweight ━━━ */
.menu-card.active {
  animation: neonBreath 3s ease-in-out infinite;
}

@keyframes neonBreath {
  0%, 100% {
    box-shadow: 0 0 12px rgba(212, 168, 83, 0.35),
                0 0 25px rgba(212, 168, 83, 0.12);
  }
  50% {
    box-shadow: 0 0 18px rgba(212, 168, 83, 0.5),
                0 0 35px rgba(212, 168, 83, 0.2);
  }
}

.menu-card:hover {
  animation: none;
}

/* Scroll dots */
.scroll-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 0 40px;
}

.scroll-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold-dim);
  opacity: 0.3;
  transition: all 0.3s ease;
}

.scroll-dot.active {
  opacity: 1;
  background: var(--gold);
  width: 20px;
  border-radius: 3px;
  box-shadow: 0 0 6px rgba(212, 168, 83, 0.4);
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.92);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: all 0.35s ease;
}

.modal-overlay.open {
  opacity: 1;
  visibility: visible;
}

.modal-content {
  width: 90vw;
  max-width: 700px;
  height: 80vh;
  max-height: 700px;
  background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
  border-radius: 24px;
  border: 1.5px solid var(--gold-dim);
  box-shadow: 0 0 20px rgba(212, 168, 83, 0.3), 0 20px 60px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: scale(0.9) translateY(20px);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal-overlay.open .modal-content {
  transform: scale(1) translateY(0);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 28px;
  border-bottom: 1px solid rgba(212, 168, 83, 0.15);
}

.modal-title {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 1.3rem;
  color: var(--gold);
  letter-spacing: 1px;
}

.modal-close {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--gold-dim);
  background: transparent;
  color: var(--gold);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}

.modal-close:hover {
  background: rgba(212, 168, 83, 0.15);
  box-shadow: 0 0 10px rgba(212, 168, 83, 0.3);
}

.modal-viewer { flex: 1; }

.modal-viewer model-viewer {
  width: 100%;
  height: 100%;
}

/* About cards */
.about-card-icon {
  font-size: 3rem;
  margin-bottom: 10px;
  display: block;
  text-align: center;
}

.about-card-label {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 1rem;
  color: var(--gold);
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.about-card-value {
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 0.9rem;
  color: rgba(255,255,255,0.9);
  text-align: center;
  line-height: 1.5;
}

/* Responsive */
@media (max-width: 1024px) {
  .menu-card { flex: 0 0 260px; height: 350px; }
  .carousel-track { gap: 24px; padding: 40px 30px 60px; }
  .category-header { padding: 0 30px 18px; }
}

@media (max-width: 768px) {
  .menu-card { flex: 0 0 240px; height: 330px; }
  .carousel-track { gap: 18px; padding: 35px 24px 50px; }
  .category-header { padding: 0 24px 15px; }
  .carousel-nav { width: 36px; height: 36px; font-size: 14px; }
  .category-section { padding: 20px 0 40px; }
}

@media (max-width: 480px) {
  .menu-card { flex: 0 0 260px; height: 340px; }
  .carousel-track { gap: 16px; padding: 35px 20px 45px; }
  .category-header { padding: 0 20px 12px; }
  .carousel-nav { display: none; }
  .card-title-3d { font-size: 0.95rem; top: -50px; }
  .modal-content { width: 95vw; height: 75vh; border-radius: 18px; }
}

/* ━━━ REDUCE MOTION for users who prefer it ━━━ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

// ━━━ BUILD ━━━
const app = document.getElementById('app');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalClose = document.getElementById('modal-close');
const bgOverlay = document.getElementById('bg-overlay');
const bgGlow = document.getElementById('bg-glow');

function buildApp() {
  let html = '';
  menuData.forEach(cat => {
    html += `<section class="category-section" data-cat-id="${cat.id}" data-bg="${cat.colors.bg}" data-glow="${cat.colors.glow}">
      <div class="category-header">
        <h2 class="category-title">${cat.name}</h2>
        <div class="category-subtitle">${cat.subtitle}</div>
      </div>
      <div class="carousel-wrapper">
        <button class="carousel-nav prev" data-cat="${cat.id}" aria-label="Previous">‹</button>
        <div class="carousel-track" data-cat-track="${cat.id}">`;

    cat.cards.forEach((card, idx) => {
      html += card.isAbout ? buildAboutCard(card, cat.id, idx) : buildMenuCard(card, cat.id, idx);
    });

    html += `</div>
        <button class="carousel-nav next" data-cat="${cat.id}" aria-label="Next">›</button>
      </div>
      <div class="scroll-dots" data-dots="${cat.id}">`;
    cat.cards.forEach((_, idx) => {
      html += `<div class="scroll-dot${idx === 0 ? ' active' : ''}" data-dot-idx="${idx}"></div>`;
    });
    html += `</div></section>`;
  });
  app.innerHTML = html;
}

function buildMenuCard(card, catId, idx) {
  return `<div class="menu-card${idx === 0 ? ' active' : ''}" data-cat="${catId}" data-idx="${idx}" data-aura="${card.aura}" data-name="${card.name}">
    <div class="card-inner">
      <div class="card-bg" style="background:${card.gradient}"></div>
      <div class="card-overlay"></div>
      <div class="card-shine"></div>
      <div class="card-content">
        <div class="card-title">${card.name}</div>
        <div class="card-desc">${card.desc}</div>
        <div class="card-price">Rs. ${card.price}</div>
      </div>
    </div>
    <div class="card-title-3d">${card.name}</div>
  </div>`;
    }
  function buildAboutCard(card, catId, idx) {
  return `<div class="menu-card${idx === 0 ? ' active' : ''}" data-cat="${catId}" data-idx="${idx}" data-aura="${card.aura}" data-name="${card.name}" data-about-action="${card.action}">
    <div class="card-inner">
      <div class="card-bg" style="background:${card.gradient}"></div>
      <div class="card-overlay"></div>
      <div class="card-shine"></div>
      <div class="card-content">
        <div class="about-card-icon">${card.icon}</div>
        <div class="about-card-label">${card.label}</div>
        <div class="about-card-value">${card.value}</div>
        <div class="card-desc" style="margin-top:10px">${card.desc}</div>
      </div>
    </div>
    <div class="card-title-3d">${card.label}</div>
  </div>`;
}

buildApp();

// ━━━ CAROUSEL ━━━
document.querySelectorAll('.carousel-track').forEach(track => {
  let isDown = false, startX, scrollL, moved = false;
  const catId = track.dataset.catTrack;

  track.addEventListener('mousedown', e => {
    isDown = true; moved = false;
    track.classList.add('grabbing');
    startX = e.pageX - track.offsetLeft;
    scrollL = track.scrollLeft;
  });
  track.addEventListener('mouseleave', () => { isDown = false; track.classList.remove('grabbing'); });
  track.addEventListener('mouseup', () => { isDown = false; track.classList.remove('grabbing'); });
  track.addEventListener('mousemove', e => {
    if (!isDown) return;
    e.preventDefault();
    moved = true;
    const x = e.pageX - track.offsetLeft;
    track.scrollLeft = scrollL - (x - startX) * 1.5;
  });

  let scrollTimeout;
  track.addEventListener('scroll', () => {
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => updateActiveCard(track, catId), 60);
  }, { passive: true });
});

function updateActiveCard(track, catId) {
  const cards = track.querySelectorAll('.menu-card');
  const trackRect = track.getBoundingClientRect();
  const center = trackRect.left + trackRect.width / 2;
  let closest = null, minDist = Infinity;

  cards.forEach(card => {
    const r = card.getBoundingClientRect();
    const d = Math.abs(r.left + r.width / 2 - center);
    if (d < minDist) { minDist = d; closest = card; }
  });

  cards.forEach(c => c.classList.remove('active'));
  if (closest) {
    closest.classList.add('active');
    updateDots(catId, parseInt(closest.dataset.idx));

    // Update bg glow color
    const aura = closest.dataset.aura;
    if (aura) {
      bgGlow.style.background = `radial-gradient(ellipse at center, ${aura} 0%, transparent 70%)`;
    }
  }
}

function updateDots(catId, activeIdx) {
  const dots = document.querySelector(`[data-dots="${catId}"]`);
  if (!dots) return;
  dots.querySelectorAll('.scroll-dot').forEach((d, i) => d.classList.toggle('active', i === activeIdx));
}

// Nav buttons
document.querySelectorAll('.carousel-nav').forEach(btn => {
  btn.addEventListener('click', () => {
    const track = document.querySelector(`[data-cat-track="${btn.dataset.cat}"]`);
    const w = (track.querySelector('.menu-card')?.offsetWidth || 300) + 30;
    track.scrollBy({ left: btn.classList.contains('prev') ? -w : w, behavior: 'smooth' });
  });
});

// ━━━ DYNAMIC BACKGROUND (optimized — no blur) ━━━
const sectionObs = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting && entry.intersectionRatio > 0.3) {
      const s = entry.target;
      bgOverlay.style.background = `radial-gradient(ellipse at center, ${s.dataset.bg} 0%, rgba(10,10,10,0.95) 70%, #0a0a0a 100%)`;
    }
  });
}, { threshold: [0.3, 0.5] });

document.querySelectorAll('.category-section').forEach(s => sectionObs.observe(s));

// ━━━ CARD CLICK ━━━
document.addEventListener('click', e => {
  const card = e.target.closest('.menu-card');
  if (!card) return;

  const aboutAction = card.dataset.aboutAction;
  if (aboutAction) { window.open(aboutAction, '_blank'); return; }

  modalTitle.textContent = card.dataset.name;
  document.getElementById('modal-model').setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
});

modalClose.addEventListener('click', () => { modal.classList.remove('open'); document.body.style.overflow = ''; });
modal.addEventListener('click', e => { if (e.target === modal) { modal.classList.remove('open'); document.body.style.overflow = ''; } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) { modal.classList.remove('open'); document.body.style.overflow = ''; } });

// Center first cards
window.addEventListener('load', () => {
  document.querySelectorAll('.carousel-track').forEach(track => {
    const card = track.querySelector('.menu-card');
    if (card) {
      const off = Math.max((track.offsetWidth - card.offsetWidth) / 2, 20);
      track.style.paddingLeft = off + 'px';
      track.style.paddingRight = off + 'px';
    }
  });
});
</script>
