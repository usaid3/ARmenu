<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chai Dosti — Premium Digital Menu</title>

<!-- 
  ╔══════════════════════════════════════════════════════════╗
  ║  MODEL VIEWER SCRIPT                                     ║
  ║  Ye Google ka 3D Model Viewer hai                        ║
  ║  Iske through hum 3D .glb files browser me dikhate hain  ║
  ║  Har card click pe ye 3D model open hota hai              ║
  ╚══════════════════════════════════════════════════════════╝
-->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

<style>
/* 
  ╔══════════════════════════════════════════════════════════╗
  ║  GOOGLE FONTS IMPORT                                     ║
  ║  3 fonts use ho rahe hain:                               ║
  ║  1. Playfair Display → Category titles ke liye           ║
  ║  2. Inter → Body text, descriptions ke liye              ║
  ║  3. Cinzel → Card titles (3D wale) ke liye               ║
  ╚══════════════════════════════════════════════════════════╝
*/
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;700;900&display=swap');

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  RESET — Sab elements ka default margin/padding 
  hata diya takay clean layout bane
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  CSS VARIABLES — Poore app me yahi colors use 
  honge. Agar theme change karna ho to bas yahan 
  se values badlo.
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
:root {
  --bg-primary: #080808;       /* Sabse dark background */
  --gold: #d4a853;             /* Main golden color */
  --gold-bright: #f0c96e;      /* Bright golden (highlights) */
  --gold-dim: #8a6d2b;         /* Dim golden (borders, subtle) */
  --text-primary: #f5f0e8;     /* Main text color (off-white) */
  --text-secondary: #b8b0a0;   /* Secondary text (descriptions) */
  --card-radius: 24px;         /* Card ke corners kitne gol honge */
}

html { scroll-behavior: smooth; }

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  BODY — Page ka base styling
  Dark background, light text
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  BACKGROUND OVERLAY — Ye fixed hai screen pe.
  Jab user scroll kare to iska color smoothly 
  change hota hai based on which category 
  is visible. Pure page ko atmospheric feel deta hai.
  
  ⚡ PERFORMANCE: Sirf background-color change 
  hota hai, koi blur/filter nahi — SMOOTH!
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
#bg-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;    /* Click through ho jaye */
  z-index: 0;
  transition: background 1.5s ease;
  will-change: background;  /* GPU ko batao ke ye change hoga */
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  BACKGROUND GLOW — Ye bhi fixed hai screen pe.
  Active card ka color yahan reflect hota hai
  as a soft radial gradient. 
  
  ⚡ PERFORMANCE: NO filter:blur() used!
  Pehle 120px blur tha = GPU killer
  Ab sirf radial-gradient hai = FAST
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
#bg-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.1;
  transition: background 1.5s ease;
  will-change: opacity;
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  LOGO SECTION — Restaurant ka logo yahan aayega
  
  🔄 REPLACE KAISE KARO:
  1. Neeche HTML me <img> tag dhoondho id="logo-img"
  2. src="YOUR_LOGO_URL" me apna logo ka URL daalo
  3. Ya local file: src="./logo.png"
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
.logo-section {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px 10px;
  position: relative;
  z-index: 2;
}

.logo-container {
  text-align: center;
}

/* 
  Logo image styling — 
  Max width 180px rakhi hai takay zyada bada na ho
  Filter se golden tint diya hai (remove if your logo has colors)
*/
.logo-img {
  max-width: 180px;
  height: auto;
  margin-bottom: 8px;
  /* Ye filter hatao agar tumhara logo already colored hai */
  filter: drop-shadow(0 0 15px rgba(212, 168, 83, 0.3));
  transition: transform 0.3s ease;
}

.logo-img:hover {
  transform: scale(1.05);
}

/* Logo ke neeche restaurant name */
.logo-text {
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: 1.6rem;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold), var(--gold-dim));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 4px;
  text-transform: uppercase;
}

/* Logo ke neeche tagline */
.logo-tagline {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 0.7rem;
  color: var(--text-secondary);
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-top: 4px;
}

/* Logo ke neeche decorative golden line */
.logo-divider {
  width: 80px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 20px auto 0;
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  APP CONTAINER — Sab categories iske andar hain
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
.app-container {
  position: relative;
  z-index: 1;
  padding: 10px 0 40px;
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  CATEGORY SECTION — Har category (Soup, Fries, etc.)
  ka wrapper. Vertical scroll se categories change hoti 
  hain. Har section me:
  - Category title + subtitle (header)
  - Horizontal carousel (cards)
  - Scroll dots
  
  ⚠️ padding-top: 60px IMPORTANT hai — isse category 
  title aur upar wali category ke cards ke beech 
  ZYADA SPACE aata hai. Pehle 30px tha = tight tha.
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
.category-section {
  padding: 60px 0 30px;  /* ↑ TOP padding zyada = categories me gap */
  position: relative;
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  CATEGORY HEADER — Title + subtitle
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
.category-header {
  padding: 0 40px 25px;  /* Bottom padding 20→25 for more space */
}

/* 
  Category ka naam — Bold italic Playfair font
  Neeche golden line ::after se banti hai
*/
.category-title {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-style: italic;
  font-size: clamp(1.8rem, 4vw, 3rem); /* Responsive size */
  color: var(--text-primary);
  letter-spacing: 1px;
  text-transform: uppercase;
  position: relative;
  display: inline-block;
}

/* Category title ke neeche golden decorative line */
.category-title::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 0;
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, var(--gold), transparent);
  border-radius: 2px;
}

/* Category ka subtitle/tagline */
.category-subtitle {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-top: 14px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  CAROUSEL WRAPPER — Horizontal card slider ka container
  Ismein:
  - Left/Right navigation arrows
  - Carousel track (cards)
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
.carousel-wrapper {
  position: relative;
  width: 100%;
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  CAROUSEL TRACK — Ye actual scrolling area hai
  Cards horizontally scroll hote hain
  
  scroll-snap-type: x mandatory → cards snap to center
  -webkit-overflow-scrolling: touch → iOS pe smooth scroll
  
  ⚠️ padding-top: 70px IMPORTANT — Ye 3D title ke liye
  space deta hai. Pehle 40px tha = title cut ho raha tha.
  Ab 70px hai = title pura dikhta hai.
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
.carousel-track {
  display: flex;
  gap: 25px;                          /* Cards ke beech ka space */
  padding: 70px 40px 40px;           /* ↑ TOP: 3D title space | ↓ BOTTOM: dots space */
  overflow-x: auto;                   /* Horizontal scroll enable */
  scroll-snap-type: x mandatory;      /* Cards center pe snap honge */
  -webkit-overflow-scrolling: touch;   /* iOS smooth scroll */
  scrollbar-width: none;              /* Firefox scrollbar hide */
  cursor: grab;                       /* Drag cursor */
  align-items: center;
  min-height: 400px;
}

/* Chrome/Safari scrollbar hide */
.carousel-track::-webkit-scrollbar { display: none; }

/* Jab user drag kar raha ho to cursor change */
.carousel-track.grabbing { cursor: grabbing; }

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  CAROUSEL NAV ARROWS — Left/Right slide buttons
  Golden border, dark background
  Hover pe glow effect
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
.carousel-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1.5px solid var(--gold-dim);
  background: rgba(10, 10, 10, 0.85);
  color: var(--gold);
  font-size: 18px;
  cursor: pointer;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}

.carousel-nav:hover {
  background: rgba(212, 168, 83, 0.15);
  border-color: var(--gold);
  box-shadow: 0 0 12px rgba(212, 168, 83, 0.3);
}

.carousel-nav.prev { left: 8px; }
.carousel-nav.next { right: 8px; }

/* 
  ╔══════════════════════════════════════════════════════════╗
  ║                                                          ║
  ║  CARD DESIGN SYSTEM — SABSE IMPORTANT SECTION            ║
  ║                                                          ║
  ║  Har menu item ek card hai. Card me hota hai:            ║
  ║  - Gradient background (item ke theme ke mutabiq)        ║
  ║  - Dark overlay (text readable banane ke liye)           ║
  ║  - Title, Description, Price                             ║
  ║  - 3D floating title (card ke upar)                      ║
  ║  - Golden neon border                                    ║
  ║  - Shine effect on hover                                 ║
  ║                                                          ║
  ║  ⚡ PERFORMANCE OPTIMIZATIONS:                            ║
  ║  - NO infinite animations on all cards                   ║
  ║  - NO backdrop-filter (glassmorphism removed)            ║
  ║  - NO filter: blur() on any card                         ║
  ║  - will-change sirf transform/opacity pe                 ║
  ║  - Neon animation SIRF active card pe                    ║
  ║                                                          ║
  ╚══════════════════════════════════════════════════════════╝
*/

/* 
  CARD BASE — Default state (non-active, non-hover)
  
  - Scale 0.9 = side cards chhote dikhte hain (coverflow effect)
  - Opacity 0.5 = side cards dim hote hain
  - border: 2px solid gold-dim = subtle golden border
  
  ⚡ will-change: transform, opacity → GPU ko batao 
  ke ye 2 properties change hongi = smoother transitions
*/
.menu-card {
  flex: 0 0 280px;               /* Fixed width 280px */
  height: 370px;                   /* Fixed height */
  border-radius: var(--card-radius);
  position: relative;
  scroll-snap-align: center;       /* Scroll pe center pe snap */
  cursor: pointer;
  transform: scale(0.9);           /* Side cards chhote */
  opacity: 0.5;                    /* Side cards dim */
  transition: transform 0.4s ease, opacity 0.4s ease, 
              border-color 0.3s ease, box-shadow 0.4s ease;
  will-change: transform, opacity; /* GPU optimization */
  border: 2px solid rgba(138, 109, 43, 0.4); /* Subtle gold border */
  overflow: visible;               /* 3D title bahar dikhane ke liye */
}

/* 
  CARD ACTIVE STATE — Jab card center me ho
  
  - Scale 1 = full size
  - Opacity 1 = fully visible  
  - Golden border bright
  - Neon glow box-shadow (2 layers ONLY, not 3)
  
  ⚡ NEON EFFECT YAHAN HAI:
  box-shadow ki 2 layers se neon glow banta hai:
  Layer 1: 0 0 12px → Close glow (tight)
  Layer 2: 0 0 25px → Far glow (spread)
  
  Pehle 3 layers thi + 60px blur = HEAVY
  Ab 2 layers + max 25px = LIGHT ✅
*/
.menu-card.active {
  transform: scale(1);
  opacity: 1;
  border-color: var(--gold);
  box-shadow: 
    0 0 12px rgba(212, 168, 83, 0.3),   /* Close neon glow */
    0 0 25px rgba(212, 168, 83, 0.1);    /* Spread neon glow */
}

/* 
  CARD HOVER STATE — Mouse hover pe
  
  - translateY(-6px) = thoda upar uthta hai
  - Scale 1.02 = slightly bigger
  - Brighter border + stronger glow
  
  ⚡ animation: none → Active card ki breathing 
  animation hover pe band ho jati hai 
  (conflict avoid karne ke liye)
*/
.menu-card:hover {
  transform: scale(1.02) translateY(-6px);
  opacity: 1;
  border-color: var(--gold-bright);
  box-shadow: 
    0 0 15px rgba(212, 168, 83, 0.4),
    0 0 30px rgba(212, 168, 83, 0.15);
  animation: none; /* Stop breathing on hover */
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  NEON BREATHING ANIMATION — SIRF ACTIVE CARD PE
  
  Ye animation box-shadow ko slowly bright/dim karti hai
  Jaise neon light "breathe" kar rahi ho
  
  ⚡ PERFORMANCE: 
  - Pehle SAARE cards pe infinite animation thi = 100+ animations
  - Ab SIRF 1 card pe hai = 1 animation = FAST
  - box-shadow animate hota hai (GPU friendly nahi) 
    lekin sirf 1 card pe hai to OK hai
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
.menu-card.active {
  animation: neonBreath 3s ease-in-out infinite;
}

@keyframes neonBreath {
  0%, 100% {
    box-shadow: 
      0 0 10px rgba(212, 168, 83, 0.25),
      0 0 20px rgba(212, 168, 83, 0.08);
  }
  50% {
    box-shadow: 
      0 0 15px rgba(212, 168, 83, 0.4),
      0 0 30px rgba(212, 168, 83, 0.15);
  }
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  CARD INNER — Card ka andar ka container
  Gradient background + overlay + content 
  sab iske andar hai
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: var(--card-radius);
  overflow: hidden;                /* Content bahar na jaye */
  display: flex;
  flex-direction: column;
  justify-content: flex-end;       /* Content neeche jaye */
  padding: 22px 20px;
}

/* 
  CARD BACKGROUND — Har card ka unique gradient
  Ye gradient data se aata hai (JavaScript me define)
  
  Example gradients:
  - Hot Sour Soup = warm amber → deep red
  - Blue Sky = sky blue → deep blue
  - Green Tea = emerald → mint
  
  🔄 GRADIENT CHANGE: menuData array me har card ka 
  "gradient" field change karo
*/
.card-bg {
  position: absolute;
  inset: 0;
  border-radius: var(--card-radius);
}

/* 
  CARD DARK OVERLAY — Gradient background ke upar 
  ek dark layer. Isse text readable rehta hai 
  gradient ke upar.
  
  ⚡ PERFORMANCE: Pehle backdrop-filter: blur(3px) tha
  = HEAVY. Ab simple gradient overlay hai = ZERO cost.
*/
.card-overlay {
  position: absolute;
  inset: 0;
  border-radius: var(--card-radius);
  background: linear-gradient(180deg,
    rgba(0,0,0,0.02) 0%,      /* Top pe almost transparent */
    rgba(0,0,0,0.2) 35%,       /* Middle me thoda dark */
    rgba(0,0,0,0.7) 100%       /* Bottom pe dark (text area) */
  );
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  CARD SHINE — Hover pe ek light streak slide 
  hoti hai left to right (like glass reflection)
  
  ⚡ PERFORMANCE: Animation SIRF hover pe chalti hai
  Infinite nahi hai. Transform use ho raha hai = GPU friendly.
  
  Pehle: .card-shimmer with background-position animation
  Ab: Simple translateX transform
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
.card-shine {
  position: absolute;
  top: 0;
  left: -100%;
  width: 50%;
  height: 100%;
  background: linear-gradient(90deg,
    transparent,
    rgba(255,255,255,0.05),
    transparent
  );
  z-index: 3;
  pointer-events: none;
  border-radius: var(--card-radius);
  will-change: transform;
}

.menu-card:hover .card-shine {
  animation: shineSlide 0.8s ease forwards;
}

@keyframes shineSlide {
  to { left: 200%; }
}

/* Card content area — z-index 2 takay overlay ke upar rahe */
.card-content {
  position: relative;
  z-index: 2;
}

/* 
  CARD TITLE — Item ka naam (card ke andar)
  Cinzel font for premium look
  text-shadow for depth effect
*/
.card-title {
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: 1.2rem;
  color: #fff;
  text-shadow: 
    0 2px 4px rgba(0,0,0,0.5),
    0 4px 8px rgba(0,0,0,0.3);
  margin-bottom: 8px;
  line-height: 1.2;
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  3D FLOATING TITLE — Card ke UPAR floating title
  
  Ye card ke border ke upar dikhta hai, jaise text 
  card se bahar nikal raha ho (3D effect)
  
  ⚠️ position: absolute + top: -50px se ye card ke 
  upar position hota hai. Isliye carousel-track me 
  padding-top: 70px rakha hai = title cut nahi hoga.
  
  ⚡ PERFORMANCE: 
  - Pehle backdrop-filter: blur(8px) tha = HEAVY
  - Ab simple rgba background hai = ZERO cost
  - Transition sirf opacity + transform pe = GPU friendly
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
.card-title-3d {
  position: absolute;
  top: -50px;                /* Card ke 50px upar */
  left: 5px;
  right: 5px;
  z-index: 10;
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: 1rem;
  color: #fff;
  text-align: center;
  /* 3D text-shadow layers = depth illusion */
  text-shadow:
    0 1px 0 rgba(255,255,255,0.08),
    0 2px 0 rgba(0,0,0,0.12),
    0 3px 0 rgba(0,0,0,0.1),
    0 4px 6px rgba(0,0,0,0.3),
    0 0 15px rgba(212, 168, 83, 0.2);
  letter-spacing: 1px;
  line-height: 1.3;
  padding: 8px 10px;
  background: rgba(0,0,0,0.7);       /* Simple dark bg, NO blur */
  border-radius: 14px 14px 0 0;
  border: 1px solid rgba(212, 168, 83, 0.2);
  border-bottom: none;
  opacity: 0;                         /* Hidden by default */
  transform: translateY(8px);
  transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none;               /* Click through */
}

/* Active ya hover pe 3D title dikhao */
.menu-card.active .card-title-3d,
.menu-card:hover .card-title-3d {
  opacity: 1;
  transform: translateY(0);
}

/* Item description */
.card-desc {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.75);
  line-height: 1.55;
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 3;              /* Max 3 lines */
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 
  PRICE — Golden gradient text
  Playfair font for elegant look
  background-clip trick se gradient text banta hai
*/
.card-price {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 1.15rem;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold), var(--gold-dim));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  SCROLL INDICATOR DOTS — Har carousel ke neeche
  Active card ka dot highlighted hota hai
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
.scroll-dots {
  display: flex;
  justify-content: center;
  gap: 5px;
  padding: 0 40px;
  margin-top: 5px;
}

.scroll-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold-dim);
  opacity: 0.3;
  transition: all 0.3s ease;
}

/* Active dot = wider + brighter + golden */
.scroll-dot.active {
  opacity: 1;
  background: var(--gold);
  width: 18px;
  border-radius: 3px;
  box-shadow: 0 0 6px rgba(212, 168, 83, 0.3);
}

/* 
  ╔══════════════════════════════════════════════════════════╗
  ║  3D MODEL VIEWER MODAL                                   ║
  ║                                                          ║
  ║  Jab kisi card pe click karo to ye modal open hota hai   ║
  ║  Andar Google Model Viewer se 3D model rotate hota hai   ║
  ║                                                          ║
  ║  🔄 3D MODEL REPLACE KAISE KARO:                         ║
  ║  1. JavaScript me menuData array dhoondho                ║
  ║  2. Har card me ek "model3d" field add karo              ║
  ║     Example: model3d: "https://your-url.com/chai.glb"   ║
  ║  3. Card click handler me modalModel.src me              ║
  ║     card.dataset.model se URL aayega                     ║
  ║  4. Ya directly har card ke data-model attribute me      ║
  ║     URL daalo (HTML me)                                  ║
  ║                                                          ║
  ║  SUPPORTED FORMATS: .glb, .gltf                          ║
  ║  FREE 3D MODELS: sketchfab.com, poly.pizza              ║
  ╚══════════════════════════════════════════════════════════╝
*/
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s ease, visibility 0.35s ease;
}

.modal-overlay.open {
  opacity: 1;
  visibility: visible;
}

.modal-content {
  width: 90vw;
  max-width: 650px;
  height: 78vh;
  max-height: 650px;
  background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
  border-radius: 22px;
  border: 1.5px solid var(--gold-dim);
  box-shadow: 0 0 18px rgba(212, 168, 83, 0.25), 
              0 16px 50px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: scale(0.92) translateY(15px);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal-overlay.open .modal-content {
  transform: scale(1) translateY(0);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid rgba(212, 168, 83, 0.15);
}

.modal-title {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 1.2rem;
  color: var(--gold);
  letter-spacing: 1px;
}

/* Modal close button */
.modal-close {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--gold-dim);
  background: transparent;
  color: var(--gold);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s ease, box-shadow 0.3s ease;
}

.modal-close:hover {
  background: rgba(212, 168, 83, 0.12);
  box-shadow: 0 0 8px rgba(212, 168, 83, 0.25);
}

/* Model viewer container */
.modal-viewer {
  flex: 1;
}

.modal-viewer model-viewer {
  width: 100%;
  height: 100%;
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ABOUT US CARDS — Special styling
  Ye cards clickable links hain (WhatsApp, Phone, Maps)
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
.about-card-icon {
  font-size: 2.8rem;
  margin-bottom: 8px;
  display: block;
  text-align: center;
}

.about-card-label {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--gold);
  text-align: center;
  margin-bottom: 6px;
  letter-spacing: 1px;
}

.about-card-value {
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.85);
  text-align: center;
  line-height: 1.5;
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  RESPONSIVE BREAKPOINTS
  
  Tablet (1024px): Cards thode chhote
  Mobile (768px): Cards aur chhote, less padding
  Small Mobile (480px): Nav arrows hide, single card view
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
@media (max-width: 1024px) {
  .menu-card { flex: 0 0 250px; height: 340px; }
  .carousel-track { gap: 22px; padding: 65px 30px 35px; }
  .category-header { padding: 0 30px 22px; }
}

@media (max-width: 768px) {
  .menu-card { flex: 0 0 235px; height: 320px; }
  .carousel-track { gap: 18px; padding: 60px 24px 30px; }
  .category-header { padding: 0 24px 18px; }
  .carousel-nav { width: 36px; height: 36px; font-size: 14px; }
  .category-section { padding: 45px 0 25px; }
  .logo-img { max-width: 140px; }
  .logo-text { font-size: 1.3rem; }
}

@media (max-width: 480px) {
  .menu-card { flex: 0 0 250px; height: 330px; }
  .carousel-track { gap: 14px; padding: 55px 18px 28px; }
  .category-header { padding: 0 18px 15px; }
  .carousel-nav { display: none; }  /* Small screens pe arrows hide */
  .card-title-3d { font-size: 0.9rem; top: -45px; }
  .modal-content { width: 95vw; height: 72vh; border-radius: 16px; }
  .logo-img { max-width: 120px; }
  .logo-text { font-size: 1.1rem; letter-spacing: 3px; }
  .category-section { padding: 35px 0 20px; }
}

/* 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ACCESSIBILITY — Reduced motion preference
  Agar user ke system me "reduce motion" ON hai
  to sab animations off ho jayengi
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- 
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  BACKGROUND LAYERS — Fixed elements
  Ye 2 layers background me atmospheric color deti hain
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

<div id="bg-overlay"></div>

<!--

  ║  LOGO SECTION                                            ║

  ║  🔄 APNA LOGO LAGANE KE LIYE:                            ║
  ║  1. Neeche <img> tag me src="" me apna logo URL daalo    ║
  ║  2. Example: src="./images/logo.png"                     ║
  ║  3. Ya online URL: src="https://example.com/logo.png"   ║
  ║  4. Recommended size: 300x300px ya 400x200px             ║
  ║  5. Format: PNG with transparent background best hai     ║
  ║  6. Agar logo dark hai to .logo-img me filter hata do    ║
  ╚══════════════════════════════════════════════════════════╝
-->
<div class="logo-section">

    <img

<!--

  APP CONTAINER — JavaScript sab categories + cards

  ╔══════════════════════════════════════════════════════════╗

<div class="modal-overlay" id="modal">

/*
  ╔══════════════════════════════════════════════════════════╗
  ║  DOM REFERENCES                                          ║
  ║  Ye variables HTML elements ko reference karte hain      ║
  ║  JavaScript se in elements ko control karne ke liye       ║
  ╚══════════════════════════════════════════════════════════╝
*/
const app = document.getElementById('app');        // Main container jahan categories render hongi
const modal = document.getElementById('modal');    // 3D model viewer modal
const modalTitle = document.getElementById('modal-title');  // Modal me item name
const modalClose = document.getElementById('modal-close');  // Modal close button
const modalModel = document.getElementById('modal-model');  // Model viewer element
const bgOverlay = document.getElementById('bg-overlay');    // Background color overlay
const bgGlow = document.getElementById('bg-glow');          // Background glow effect


/*
  ╔══════════════════════════════════════════════════════════╗
  ║  BUILD APP FUNCTION                                      ║
  ║                                                          ║
  ║  Ye function poora menu dynamically generate karta hai   ║
  ║  menuData array se categories aur cards bana ke           ║
  ║  #app container me inject karta hai                      ║
  ║                                                          ║
  ║  Flow:                                                   ║
  ║  1. menuData loop karo                                   ║
  ║  2. Har category ka section banao                        ║
  ║  3. Us category ke cards banao (menu ya about)           ║
  ║  4. Scroll dots banao                                    ║
  ║  5. Sab HTML ek string me jodo                           ║
  ║  6. innerHTML se inject karo                              ║
  ╚══════════════════════════════════════════════════════════╝
*/
function buildApp() {
  let html = '';
  
  menuData.forEach(cat => {
    // ── Category section start ──
    html += `<section class="category-section" 
      data-cat-id="${cat.id}" 
      data-bg="${cat.colors.bg}" 
      data-glow="${cat.colors.glow}">`;
    
    // ── Category header (title + subtitle) ──
    html += `<div class="category-header">
      <h2 class="category-title">${cat.name}</h2>
      <div class="category-subtitle">${cat.subtitle}</div>
    </div>`;
    
    // ── Carousel wrapper (arrows + track) ──
    html += `<div class="carousel-wrapper">
      <button class="carousel-nav prev" data-cat="${cat.id}" aria-label="Previous">‹</button>
      <div class="carousel-track" data-cat-track="${cat.id}">`;
    
    // ── Cards generate karo ──
    cat.cards.forEach((card, idx) => {
      if (card.isAbout) {
        // About Us cards ka alag HTML structure hai
        html += buildAboutCard(card, cat.id, idx);
      } else {
        // Regular menu cards
        html += buildMenuCard(card, cat.id, idx);
      }
    });
    
    html += `</div>
      <button class="carousel-nav next" data-cat="${cat.id}" aria-label="Next">›</button>
    </div>`;
    
    // ── Scroll indicator dots ──
    html += `<div class="scroll-dots" data-dots="${cat.id}">`;
    cat.cards.forEach((_, idx) => {
      html += `<div class="scroll-dot${idx === 0 ? ' active' : ''}" data-dot-idx="${idx}"></div>`;
    });
    html += `</div>`;
    
    html += `</section>`;
  });
  
  app.innerHTML = html;
}


/*
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  BUILD MENU CARD — Regular food/drink card HTML
  
  Parameters:
  - card: card data object (name, price, desc, etc.)
  - catId: category ID number
  - idx: card index in category
  
  Returns: HTML string
  
  Card structure:
  ┌─────────────────────────┐
  │  [3D Title - floating]  │ ← .card-title-3d (outside card)
  ├─────────────────────────┤
  │                         │ ← .card-bg (gradient)
  │                         │ ← .card-overlay (dark layer)
  │                         │ ← .card-shine (hover effect)
  │  Card Title             │ ← .card-title
  │  Description text...    │ ← .card-desc
  │  Rs. 350                │ ← .card-price
  └─────────────────────────┘
  
  data-model attribute me 3D model URL daal sakte ho
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
function buildMenuCard(card, catId, idx) {
  // model3d field agar card me hai to use karo, warna default astronaut
  const modelUrl = card.model3d || "https://modelviewer.dev/shared-assets/models/Astronaut.glb";
  
  return `<div class="menu-card${idx === 0 ? ' active' : ''}" 
    data-cat="${catId}" 
    data-idx="${idx}" 
    data-aura="${card.aura}" 
    data-name="${card.name}"
    data-model="${modelUrl}">
    
    <!-- 3D Floating Title — Card ke upar dikhta hai -->
    <div class="card-title-3d">${card.name}</div>
    
    <div class="card-inner">
      <!-- Gradient Background — Har card ka unique color -->
      <div class="card-bg" style="background:${card.gradient}"></div>
      
      <!-- Dark Overlay — Text readable banata hai -->
      <div class="card-overlay"></div>
      
      <!-- Shine Effect — Hover pe light streak -->
      <div class="card-shine"></div>
      
      <!-- Content — Title, Description, Price -->
      <div class="card-content">
        <div class="card-title">${card.name}</div>
        <div class="card-desc">${card.desc}</div>
        <div class="card-price">Rs. ${card.price}</div>
      </div>
    </div>
  </div>`;
}


/*
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  BUILD ABOUT CARD — Special About Us cards
  WhatsApp, Phone, Address cards
  Ye click pe external link kholte hain (3D model nahi)
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
function buildAboutCard(card, catId, idx) {
  return `<div class="menu-card${idx === 0 ? ' active' : ''}" 
    data-cat="${catId}" 
    data-idx="${idx}" 
    data-aura="${card.aura}" 
    data-name="${card.name}" 
    data-about-action="${card.action}">
    
    <div class="card-title-3d">${card.label}</div>
    
    <div class="card-inner">
      <div class="card-bg" style="background:${card.gradient}"></div>
      <div class="card-overlay"></div>
      <div class="card-shine"></div>
      
      <div class="card-content">
        <div class="about-card-icon">${card.icon}</div>
        <div class="about-card-label">${card.label}</div>
        <div class="about-card-value">${card.value}</div>
        <div class="card-desc" style="margin-top:8px">${card.desc}</div>
      </div>
    </div>
  </div>`;
}

// ── App build karo ──
buildApp();


/*
  ╔══════════════════════════════════════════════════════════╗
  ║  CAROUSEL DRAG/SCROLL SYSTEM                            ║
  ║                                                          ║
  ║  Har carousel track pe:                                  ║
  ║  1. Mouse drag (desktop) — mousedown/move/up events      ║
  ║  2. Touch swipe (mobile) — native scroll                 ║
  ║  3. Scroll event pe active card detect karo               ║
  ║                                                          ║
  ║  ⚡ PERFORMANCE:                                          ║
  ║  - Scroll handler DEBOUNCED hai (80ms delay)              ║
  ║  - Ye isliye ke scroll event bohot fast fire hota hai     ║
  ║  - Debounce se sirf last scroll ke baad calculate hota    ║
  ╚══════════════════════════════════════════════════════════╝
*/
document.querySelectorAll('.carousel-track').forEach(track => {
  let isDown = false;     // Kya mouse pressed hai?
  let startX;             // Mouse press ka starting X position
  let scrollL;            // Scroll position jab mouse press hua
  const catId = track.dataset.catTrack;

  // ── Mouse press start ──
  track.addEventListener('mousedown', e => {
    isDown = true;
    track.classList.add('grabbing');
    startX = e.pageX - track.offsetLeft;
    scrollL = track.scrollLeft;
  });

  // ── Mouse leave / release ──
  track.addEventListener('mouseleave', () => { 
    isDown = false; 
    track.classList.remove('grabbing'); 
  });
  track.addEventListener('mouseup', () => { 
    isDown = false; 
    track.classList.remove('grabbing'); 
  });

  // ── Mouse move (drag) ──
  track.addEventListener('mousemove', e => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - track.offsetLeft;
    // 1.5 multiplier = drag speed faster feel hota hai
    track.scrollLeft = scrollL - (x - startX) * 1.5;
  });

  // ── Scroll event (debounced) ──
  // Jab bhi scroll ho (drag ya touch), active card update karo
  let scrollTimeout;
  track.addEventListener('scroll', () => {
    clearTimeout(scrollTimeout);
    // 80ms baad calculate karo — smooth performance
    scrollTimeout = setTimeout(() => updateActiveCard(track, catId), 80);
  }, { passive: true });  // passive: true = scroll block nahi hoga = smoother
});


/*
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  UPDATE ACTIVE CARD — Center card detect karo
  
  Logic:
  1. Track ka center point nikalo
  2. Sab cards ka center point nikalo
  3. Jo card track center ke sabse close ho = ACTIVE
  4. Active card ko highlight karo
  5. Dots update karo
  6. Background glow color update karo
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
function updateActiveCard(track, catId) {
  const cards = track.querySelectorAll('.menu-card');
  const trackRect = track.getBoundingClientRect();
  const center = trackRect.left + trackRect.width / 2;  // Track ka center
  
  let closest = null;
  let minDist = Infinity;

  // Har card check karo — konsa center ke sabse close hai
  cards.forEach(card => {
    const r = card.getBoundingClientRect();
    const cardCenter = r.left + r.width / 2;
    const d = Math.abs(cardCenter - center);
    if (d < minDist) { 
      minDist = d; 
      closest = card; 
    }
  });

  // Sab cards se active class hatao
  cards.forEach(c => c.classList.remove('active'));
  
  if (closest) {
    // Closest card ko active banao
    closest.classList.add('active');
    
    // Dots update karo
    updateDots(catId, parseInt(closest.dataset.idx));

    // Background glow color update karo
    const aura = closest.dataset.aura;
    if (aura) {
      bgGlow.style.background = `radial-gradient(ellipse at center, ${aura} 0%, transparent 70%)`;
    }
  }
}


/*
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  UPDATE DOTS — Scroll indicator dots ko update karo
  Active card ke index wale dot ko highlight karo
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
function updateDots(catId, activeIdx) {
  const dots = document.querySelector(`[data-dots="${catId}"]`);
  if (!dots) return;
  dots.querySelectorAll('.scroll-dot').forEach((d, i) => {
    d.classList.toggle('active', i === activeIdx);
  });
}


/*
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  NAV ARROW BUTTONS — Left/Right click handlers
  Click pe carousel ko ek card width se scroll karo
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
document.querySelectorAll('.carousel-nav').forEach(btn => {
  btn.addEventListener('click', () => {
    const track = document.querySelector(`[data-cat-track="${btn.dataset.cat}"]`);
    // Card width + gap = scroll amount
    const w = (track.querySelector('.menu-card')?.offsetWidth || 280) + 25;
    
    if (btn.classList.contains('prev')) {
      track.scrollBy({ left: -w, behavior: 'smooth' });  // Left scroll
    } else {
      track.scrollBy({ left: w, behavior: 'smooth' });   // Right scroll
    }
  });
});


/*
  ╔══════════════════════════════════════════════════════════╗
  ║  DYNAMIC BACKGROUND COLOR SYSTEM                         ║
  ║                                                          ║
  ║  Intersection Observer use kar ke detect karte hain       ║
  ║  ke konsi category screen pe visible hai                  ║
  ║                                                          ║
  ║  Jab category 30% se zyada visible ho:                   ║
  ║  → Background overlay ka color change karo                ║
  ║  → Smooth 1.5s transition se blend hota hai               ║
  ║                                                          ║
  ║  ⚡ PERFORMANCE:                                          ║
  ║  - Intersection Observer browser-native hai               ║
  ║  - Scroll event pe fire NAHI hota                         ║
  ║  - Sirf jab visibility change ho tab fire hota hai        ║
  ║  - Bohot efficient hai vs scroll listener                 ║
  ╚══════════════════════════════════════════════════════════╝
*/
const sectionObs = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting && entry.intersectionRatio > 0.3) {
      const s = entry.target;
      // Category ka bg color apply karo
      bgOverlay.style.background = `radial-gradient(ellipse at center, 
        ${s.dataset.bg} 0%, 
        rgba(8,8,8,0.95) 70%, 
        #080808 100%)`;
    }
  });
}, { 
  threshold: [0.3, 0.5]  // 30% ya 50% visible hone pe trigger
});

// Sab category sections ko observe karo
document.querySelectorAll('.category-section').forEach(s => sectionObs.observe(s));


/*
  ╔══════════════════════════════════════════════════════════╗
  ║  CARD CLICK HANDLER                                      ║
  ║                                                          ║
  ║  2 types of behavior:                                    ║
  ║                                                          ║
  ║  1. ABOUT CARDS (WhatsApp/Phone/Address):                ║
  ║     → External link open karo (new tab/dialer/maps)      ║
  ║                                                          ║
  ║  2. REGULAR MENU CARDS:                                  ║
  ║     → 3D Model Viewer modal open karo                    ║
  ║     → Model URL card ke data-model attribute se aata hai ║
  ║                                                          ║
  ║  🔄 APNA 3D MODEL LAGANE KE LIYE:                        ║
  ║  Option A: menuData me model3d field add karo             ║
  ║     { name: "Soup", model3d: "https://url/soup.glb" }   ║
  ║                                                          ║
  ║  Option B: Generated HTML me data-model change karo       ║
  ║     data-model="https://url/soup.glb"                    ║
  ║                                                          ║
  ║  SUPPORTED: .glb aur .gltf formats                       ║
  ╚══════════════════════════════════════════════════════════╝
*/
document.addEventListener('click', e => {
  const card = e.target.closest('.menu-card');
  if (!card) return;  // Agar card pe click nahi hua to ignore

  // ── Check: About card hai? ──
  const aboutAction = card.dataset.aboutAction;
  if (aboutAction) {
    // About card pe click = external link open karo
    window.open(aboutAction, '_blank');
    return;
  }

  // ── Regular card = 3D model modal open karo ──
  const name = card.dataset.name;
  const modelUrl = card.dataset.model || 
    "https://modelviewer.dev/shared-assets/models/Astronaut.glb";
  
  modalTitle.textContent = name;               // Modal me item name set karo
  modalModel.setAttribute('src', modelUrl);    // 3D model URL set karo
  modal.classList.add('open');                  // Modal dikhao
  document.body.style.overflow = 'hidden';     // Background scroll band karo
});


/*
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  MODAL CLOSE HANDLERS
  3 ways to close modal:
  1. Close button click
  2. Overlay (dark area) click
  3. Escape key press
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/

// Close button
modalClose.addEventListener('click', closeModal);

// Click on dark overlay (outside modal content)
modal.addEventListener('click', e => {
  if (e.target === modal) closeModal();
});

// Escape key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
});

function closeModal() {
  modal.classList.remove('open');
  document.body.style.overflow = '';  // Background scroll wapas chalu
}


/*
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  INITIAL SETUP — Page load ke baad
  
  Har carousel me pehla card center me dikhana hai
  Isliye dynamic padding calculate karte hain:
  
  paddingLeft = (track width - card width) / 2
  
  Isse first card exactly center me aata hai
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
*/
window.addEventListener('load', () => {
  document.querySelectorAll('.carousel-track').forEach(track => {
    const card = track.querySelector('.menu-card');
    if (card) {
      const off = Math.max((track.offsetWidth - card.offsetWidth) / 2, 20);
      track.style.paddingLeft = off + 'px';
      track.style.paddingRight = off + 'px';
    }
  });
});
</script>
</body>
