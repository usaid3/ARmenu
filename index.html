<script>
class TradingCalculator {
    constructor() {
        this.positionType = 'long';
        this.initializeElements();
        this.loadSettings();
        this.setupEventListeners();
    }

    initializeElements() {
        this.capital = document.getElementById('capital');
        this.risk = document.getElementById('risk');
        this.entry = document.getElementById('entry');
        this.stopLoss = document.getElementById('stopLoss');
        this.rrRatio = document.getElementById('rrRatio');
        this.leverage = document.getElementById('leverage');
        this.leverageToggle = document.getElementById('leverageToggle');
        this.leverageVal = document.getElementById('leverageVal');
        
        this.resSL = document.getElementById('resSL');
        this.resTP = document.getElementById('resTP');
        this.resPositionSize = document.getElementById('resPositionSize');
        this.resRiskAmt = document.getElementById('resRiskAmt');
        this.resProfitPot = document.getElementById('resProfitPot');
        
        this.calcBtn = document.getElementById('calcBtn');
        this.saveBtn = document.getElementById('saveBtn');
        this.clearBtn = document.getElementById('clearBtn');
        this.historyBtn = document.getElementById('historyBtn');
        this.settingsBtn = document.getElementById('settingsBtn');
        this.exportBtn = document.getElementById('exportBtn');
        this.importBtn = document.getElementById('importBtn');
        this.clearHistoryBtn = document.getElementById('clearHistoryBtn');
        this.saveSettingsBtn = document.getElementById('saveSettingsBtn');
        
        this.defaultLeverage = document.getElementById('defaultLeverage');
        this.defaultRisk = document.getElementById('defaultRisk');
        this.defaultRR = document.getElementById('defaultRR');
    }

    setupEventListeners() {
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', (e) => this.switchPositionType(e.target.dataset.tab));
        });

        this.leverage.addEventListener('input', () => this.updateLeverageDisplay());
        this.leverageToggle.addEventListener('change', () => this.toggleLeverage());

        this.calcBtn.addEventListener('click', () => this.calculate());
        this.saveBtn.addEventListener('click', () => this.saveSetup());
        this.clearBtn.addEventListener('click', () => this.clearForm());
        this.historyBtn.addEventListener('click', () => this.showHistory());
        this.settingsBtn.addEventListener('click', () => this.showSettings());
        this.exportBtn.addEventListener('click', () => this.exportData());
        this.importBtn.addEventListener('click', () => this.importData());
        this.clearHistoryBtn.addEventListener('click', () => this.clearHistory());
        this.saveSettingsBtn.addEventListener('click', () => this.saveSettings());

        [this.entry, this.stopLoss, this.rrRatio].forEach(el => {
            el.addEventListener('input', () => this.calculate());
        });
    }

    switchPositionType(type) {
        this.positionType = type;
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`[data-tab="${type}"]`).classList.add('active');
        this.calculate();
    }

    updateLeverageDisplay() {
        this.leverageVal.textContent = `${this.leverage.value}x`;
    }

    toggleLeverage() {
        if (this.leverageToggle.checked) {
            this.leverage.classList.remove('disabled-field');
            this.leverage.removeAttribute('disabled');
        } else {
            this.leverage.classList.add('disabled-field');
            this.leverage.setAttribute('disabled', 'true');
            this.leverage.value = 1;
        }
        this.updateLeverageDisplay();
        localStorage.setItem('leverageToggle', this.leverageToggle.checked);
        this.calculate();
    }

    calculate() {
        const capital = parseFloat(this.capital.value) || 0;
        const riskPct = parseFloat(this.risk.value) || 0;
        const entryPrice = parseFloat(this.entry.value) || 0;
        const slPrice = parseFloat(this.stopLoss.value) || 0;
        const rrRatio = parseFloat(this.rrRatio.value) || 1;
        const leverage = this.leverageToggle.checked ? parseFloat(this.leverage.value) || 1 : 1;

        if (!capital || !riskPct || !entryPrice) return;

        const riskAmount = capital * (riskPct / 100);

        if (!slPrice) {
            this.resSL.textContent = '--';
            this.resTP.textContent = '--';
            this.resPositionSize.textContent = '--';
            this.resRiskAmt.textContent = `$${riskAmount.toFixed(2)}`;
            this.resProfitPot.textContent = '--';
            return;
        }

        const slDistance = Math.abs(entryPrice - slPrice);
        const positionSize = slDistance > 0 ? (riskAmount / slDistance) : 0;

        const tpDistance = slDistance * rrRatio;
        let takeProfit;
        
        if (this.positionType === 'long') {
            takeProfit = entryPrice + tpDistance;
        } else {
            takeProfit = entryPrice - tpDistance;
        }

        const leveragedPositionSize = positionSize * leverage;
        const profitPotential = leveragedPositionSize * tpDistance;

        this.resSL.textContent = slPrice.toFixed(5);
        this.resTP.textContent = takeProfit.toFixed(5);
        this.resPositionSize.textContent = leveragedPositionSize.toFixed(4);
        this.resRiskAmt.textContent = `$${riskAmount.toFixed(2)}`;
        this.resProfitPot.textContent = `$${profitPotential.toFixed(2)}`;

        this.resSL.classList.add('neon-text');
        this.resTP.classList.add('neon-text');

        const resultPanel = document.querySelector('.glass-panel-elevated');
        resultPanel.style.transform = 'scale(1.02)';
        setTimeout(() => resultPanel.style.transform = 'scale(1)', 200);
    }

    saveSetup() {
        const setup = {
            id: Date.now(),
            positionType: this.positionType,
            capital: parseFloat(this.capital.value),
            risk: parseFloat(this.risk.value),
            entry: parseFloat(this.entry.value),
            stopLoss: parseFloat(this.stopLoss.value),
            rrRatio: parseFloat(this.rrRatio.value),
            leverage: parseFloat(this.leverage.value),
            date: new Date().toISOString(),
            results: {
                sl: this.resSL.textContent,
                tp: this.resTP.textContent,
                positionSize: this.resPositionSize.textContent,
                riskAmt: this.resRiskAmt.textContent,
                profitPot: this.resProfitPot.textContent
            }
        };

        let history = JSON.parse(localStorage.getItem('usaid_history')) || [];
        history.unshift(setup);
        localStorage.setItem('usaid_history', JSON.stringify(history));

        const originalText = this.saveBtn.innerHTML;
        this.saveBtn.innerHTML = '<span class="material-symbols-outlined text-sm" style="font-size: 16px;">check</span> Saved!';
        setTimeout(() => {
            this.saveBtn.innerHTML = originalText;
        }, 2000);
    }

    clearForm() {
        this.capital.value = '10000';
        this.risk.value = this.defaultRisk.value;
        this.entry.value = '';
        this.stopLoss.value = '';
        this.rrRatio.value = this.defaultRR.value;
        this.leverage.value = this.defaultLeverage.value;
        
        this.resSL.textContent = '--';
        this.resTP.textContent = '--';
        this.resPositionSize.textContent = '--';
        this.resRiskAmt.textContent = '$--';
        this.resProfitPot.textContent = '$--';
    }

    showHistory() {
        const history = JSON.parse(localStorage.getItem('usaid_history')) || [];
        const historyList = document.getElementById('historyList');
        
        if (history.length === 0) {
            historyList.innerHTML = '<p class="text-on-surface-variant text-center py-lg">No history yet</p>';
        } else {
            historyList.innerHTML = history.map((item) => `
                <div class="history-item" onclick="window.calc.loadSetup(${item.id})">
                    <div class="flex justify-between items-start mb-xs">
                        <div class="flex items-center gap-sm">
                            <span class="text-primary-fixed-dim font-bold">${item.positionType.toUpperCase()}</span>
                            <span class="text-on-surface-variant text-xs">${new Date(item.date).toLocaleDateString()}</span>
                        </div>
                        <button class="text-error hover:text-error/80" onclick="window.calc.deleteSetup(event, ${item.id})">
                            <span class="material-symbols-outlined" style="font-size: 16px;">delete</span>
                        </button>
                    </div>
                    <div class="grid grid-cols-3 gap-xs text-xs">
                        <div>Entry: <span class="text-primary-fixed">${item.entry.toFixed(5)}</span></div>
                        <div>SL: <span class="text-error">${item.stopLoss.toFixed(5)}</span></div>
                        <div>TP: <span class="text-secondary-fixed">${item.results.tp}</span></div>
                    </div>
                </div>
            `).join('');
        }
        
        document.getElementById('historyModal').classList.add('show');
    }

    loadSetup(id) {
        const history = JSON.parse(localStorage.getItem('usaid_history')) || [];
        const setup = history.find(s => s.id === id);
        
        if (setup) {
            this.capital.value = setup.capital;
            this.risk.value = setup.risk;
            this.entry.value = setup.entry;
            this.stopLoss.value = setup.stopLoss;
            this.rrRatio.value = setup.rrRatio;
            this.leverage.value = setup.leverage;
            
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-tab="${setup.positionType}"]`).classList.add('active');
            this.positionType = setup.positionType;
            
            this.calculate();
            closeModal('historyModal');
        }
    }

    deleteSetup(event, id) {
        event.stopPropagation();
        let history = JSON.parse(localStorage.getItem('usaid_history')) || [];
        history = history.filter(s => s.id !== id);
        localStorage.setItem('usaid_history', JSON.stringify(history));
        this.showHistory();
    }

    clearHistory() {
        if (confirm('Are you sure you want to clear all history?')) {
            localStorage.setItem('usaid_history', JSON.stringify([]));
            this.showHistory();
        }
    }

    showSettings() {
        document.getElementById('settingsModal').classList.add('show');
    }

    saveSettings() {
        localStorage.setItem('defaultLeverage', this.defaultLeverage.value);
        localStorage.setItem('defaultRisk', this.defaultRisk.value);
        localStorage.setItem('defaultRR', this.defaultRR.value);
        
        alert('Settings saved!');
        closeModal('settingsModal');
    }

    loadSettings() {
        const defaultLev = localStorage.getItem('defaultLeverage') || '1';
        const defaultRsk = localStorage.getItem('defaultRisk') || '2';
        const defaultRR = localStorage.getItem('defaultRR') || '3';
        
        this.defaultLeverage.value = defaultLev;
        this.defaultRisk.value = defaultRsk;
        this.defaultRR.value = defaultRR;
        
        this.risk.value = defaultRsk;
        this.rrRatio.value = defaultRR;
        this.leverage.value = defaultLev;
    }

    exportData() {
        const history = JSON.parse(localStorage.getItem('usaid_history')) || [];
        const data = {
            exportDate: new Date().toISOString(),
            version: '1.0',
            history: history
        };
        
        const dataStr = JSON.stringify(data, null, 2);
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(dataBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `trading-history-${Date.now()}.json`;
        link.click();
    }

    importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.history && Array.isArray(data.history)) {
                        localStorage.setItem('usaid_history', JSON.stringify(data.history));
                        alert('Data imported successfully!');
                    } else {
                        alert('Invalid file format');
                    }
                } catch (err) {
                    alert('Error reading file: ' + err.message);
                }
            };
            reader.readAsText(file);
        };
        input.click();
    }
}

window.calc = new TradingCalculator();

function closeModal(modalId) {
    document.getElementById(modalId).classList.remove('show');
}

document.querySelectorAll('.modal').forEach(modal => {
    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.classList.remove('show');
        }
    });
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal.show').forEach(m => m.classList.remove('show'));
    }
    if (e.ctrlKey && e.key === 's') {
        e.preventDefault();
        window.calc.saveSetup();
    }
    if (e.ctrlKey && e.key === 'h') {
        e.preventDefault();
        window.calc.showHistory();
    }
});
</script>
</body></html>
