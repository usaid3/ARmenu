<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chai Dosti — Premium Digital Menu</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;700;900&display=swap');

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-primary: #0a0a0a;
  --bg-transition: #0a0a0a;
  --gold: #d4a853;
  --gold-bright: #f0c96e;
  --gold-dim: #8a6d2b;
  --text-primary: #f5f0e8;
  --text-secondary: #b8b0a0;
  --card-radius: 28px;
  --glow-gold: 0 0 15px rgba(212, 168, 83, 0.5), 0 0 30px rgba(212, 168, 83, 0.2);
  --glow-gold-intense: 0 0 20px rgba(212, 168, 83, 0.7), 0 0 40px rgba(212, 168, 83, 0.3), 0 0 60px rgba(212, 168, 83, 0.15);
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
  transition: background 1.2s ease;
  min-height: 100vh;
}

#bg-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  transition: background 1.5s ease;
  background: radial-gradient(ellipse at center, transparent 0%, var(--bg-primary) 100%);
}

#bg-glow {
  position: fixed;
  top: 50%; left: 50%;
  width: 800px; height: 800px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(120px);
  opacity: 0.15;
  transition: background 1.5s ease, opacity 1s ease;
}

.app-container {
  position: relative;
  z-index: 1;
  padding: 20px 0;
}

.category-section {
  padding: 30px 0 50px;
  position: relative;
}

.category-header {
  padding: 0 40px 20px;
  position: relative;
}

.category-title {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-style: italic;
  font-size: clamp(1.8rem, 4vw, 3rem);
  color: var(--text-primary);
  letter-spacing: 1px;
  text-transform: uppercase;
  position: relative;
  display: inline-block;
}

.category-title::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 0;
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, var(--gold), transparent);
  border-radius: 2px;
}

.category-subtitle {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-top: 14px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.carousel-wrapper {
  position: relative;
  width: 100%;
  overflow: visible;
}

.carousel-track {
  display: flex;
  gap: 30px;
  padding: 40px 40px 60px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  cursor: grab;
  align-items: center;
  min-height: 420px;
}

.carousel-track::-webkit-scrollbar {
  display: none;
}

.carousel-track.grabbing {
  cursor: grabbing;
}

.carousel-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1.5px solid var(--gold-dim);
  background: rgba(10, 10, 10, 0.85);
  color: var(--gold);
  font-size: 18px;
  cursor: pointer;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  backdrop-filter: blur(10px);
}

.carousel-nav:hover {
  background: rgba(212, 168, 83, 0.15);
  border-color: var(--gold);
  box-shadow: var(--glow-gold);
  transform: translateY(-50%) scale(1.1);
}

.carousel-nav.prev { left: 8px; }
.carousel-nav.next { right: 8px; }

.menu-card {
  flex: 0 0 300px;
  height: 380px;
  border-radius: var(--card-radius);
  position: relative;
  scroll-snap-align: center;
  transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  cursor: pointer;
  transform: scale(0.88) perspective(1000px);
  filter: brightness(0.65) blur(0.5px);
  overflow: visible;
}

.menu-card.active {
  transform: scale(1) perspective(1000px);
  filter: brightness(1) blur(0);
  z-index: 5;
}

.menu-card:hover {
  transform: scale(1.03) translateY(-8px) perspective(1000px);
  filter: brightness(1.05) blur(0);
}

.card-border-glow {
  position: absolute;
  inset: -2px;
  border-radius: calc(var(--card-radius) + 2px);
  padding: 2px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dim), var(--gold-bright), var(--gold-dim), var(--gold));
  background-size: 300% 300%;
  animation: borderShimmer 4s ease infinite;
  z-index: 0;
  opacity: 0.6;
  transition: opacity 0.4s ease;
}

.menu-card.active .card-border-glow,
.menu-card:hover .card-border-glow {
  opacity: 1;
  box-shadow: var(--glow-gold-intense);
  animation: borderShimmer 2s ease infinite, borderPulse 2s ease-in-out infinite;
}

@keyframes borderShimmer {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes borderPulse {
  0%, 100% { opacity: 0.8; }
  50% { opacity: 1; }
}

.card-inner {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  border-radius: var(--card-radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 24px 22px;
}

.card-bg {
  position: absolute;
  inset: 0;
  border-radius: var(--card-radius);
  z-index: 0;
}

.card-glass {
  position: absolute;
  inset: 0;
  border-radius: var(--card-radius);
  backdrop-filter: blur(3px);
  background: linear-gradient(180deg, 
    rgba(0,0,0,0.05) 0%, 
    rgba(0,0,0,0.25) 40%, 
    rgba(0,0,0,0.65) 100%
  );
  z-index: 1;
}

.card-content {
  position: relative;
  z-index: 2;
}

.card-title {
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: 1.3rem;
  color: #fff;
  text-shadow: 
    0 2px 4px rgba(0,0,0,0.5),
    0 4px 8px rgba(0,0,0,0.3),
    0 0 20px rgba(212, 168, 83, 0.2);
  margin-bottom: 10px;
  line-height: 1.2;
  transform: translateZ(20px);
  position: relative;
}

.card-title-3d {
  position: absolute;
  top: -60px;
  left: 0;
  right: 0;
  z-index: 10;
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: 1.15rem;
  color: #fff;
  text-align: center;
  text-shadow: 
    0 1px 0 rgba(255,255,255,0.15),
    0 2px 0 rgba(0,0,0,0.1),
    0 3px 0 rgba(0,0,0,0.1),
    0 4px 0 rgba(0,0,0,0.1),
    0 5px 10px rgba(0,0,0,0.4),
    0 0 30px rgba(212, 168, 83, 0.3);
  letter-spacing: 1px;
  line-height: 1.3;
  padding: 8px 12px;
  background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.4) 100%);
  border-radius: 16px 16px 0 0;
  backdrop-filter: blur(8px);
  border: 1px solid rgba(212, 168, 83, 0.2);
  border-bottom: none;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.4s ease;
  pointer-events: none;
}

.menu-card.active .card-title-3d,
.menu-card:hover .card-title-3d {
  opacity: 1;
  transform: translateY(0);
}

.card-desc {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 0.78rem;
  color: rgba(255,255,255,0.8);
  line-height: 1.6;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-price {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 1.2rem;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold), var(--gold-dim));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
}

.card-shimmer {
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,0.03) 40%,
    rgba(255,255,255,0.08) 50%,
    rgba(255,255,255,0.03) 60%,
    transparent 100%
  );
  z-index: 3;
  pointer-events: none;
  border-radius: var(--card-radius);
}

.menu-card:hover .card-shimmer {
  animation: shimmerMove 1.5s ease;
}

@keyframes shimmerMove {
  0% { left: -100%; }
  100% { left: 100%; }
}

/* Active card glow aura */
.card-aura {
  position: absolute;
  inset: -30px;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0;
  transition: opacity 0.8s ease;
  pointer-events: none;
  z-index: -1;
}

.menu-card.active .card-aura {
  opacity: 0.3;
}

/* Scroll indicators */
.scroll-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 0 40px;
}

.scroll-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold-dim);
  opacity: 0.3;
  transition: all 0.3s ease;
}

.scroll-dot.active {
  opacity: 1;
  background: var(--gold);
  width: 20px;
  border-radius: 3px;
  box-shadow: 0 0 8px rgba(212, 168, 83, 0.5);
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(20px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: all 0.4s ease;
}

.modal-overlay.open {
  opacity: 1;
  visibility: visible;
}

.modal-content {
  width: 90vw;
  max-width: 700px;
  height: 80vh;
  max-height: 700px;
  background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
  border-radius: 24px;
  border: 1.5px solid var(--gold-dim);
  box-shadow: var(--glow-gold-intense), 0 20px 60px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: scale(0.9) translateY(20px);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal-overlay.open .modal-content {
  transform: scale(1) translateY(0);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 28px;
  border-bottom: 1px solid rgba(212, 168, 83, 0.15);
}

.modal-title {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 1.3rem;
  color: var(--gold);
  letter-spacing: 1px;
}

.modal-close {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--gold-dim);
  background: transparent;
  color: var(--gold);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}

.modal-close:hover {
  background: rgba(212, 168, 83, 0.15);
  box-shadow: var(--glow-gold);
}

.modal-viewer {
  flex: 1;
  position: relative;
}

.modal-viewer model-viewer {
  width: 100%;
  height: 100%;
}

/* About Us special cards */
.about-card-icon {
  font-size: 3rem;
  margin-bottom: 10px;
  display: block;
  text-align: center;
}

.about-card-label {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 1rem;
  color: var(--gold);
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.about-card-value {
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 0.9rem;
  color: rgba(255,255,255,0.9);
  text-align: center;
  line-height: 1.5;
}

/* Responsive */
@media (max-width: 1024px) {
  .menu-card {
    flex: 0 0 260px;
    height: 350px;
  }
  .carousel-track {
    gap: 24px;
    padding: 40px 30px 60px;
  }
  .category-header {
    padding: 0 30px 18px;
  }
}

@media (max-width: 768px) {
  .menu-card {
    flex: 0 0 240px;
    height: 330px;
  }
  .carousel-track {
    gap: 18px;
    padding: 35px 24px 50px;
  }
  .category-header {
    padding: 0 24px 15px;
  }
  .carousel-nav {
    width: 36px;
    height: 36px;
    font-size: 14px;
  }
  .category-section {
    padding: 20px 0 40px;
  }
}

@media (max-width: 480px) {
  .menu-card {
    flex: 0 0 260px;
    height: 340px;
  }
  .carousel-track {
    gap: 16px;
    padding: 35px 20px 45px;
  }
  .category-header {
    padding: 0 20px 12px;
  }
  .carousel-nav {
    display: none;
  }
  .card-title-3d {
    font-size: 0.95rem;
    top: -50px;
  }
  .modal-content {
    width: 95vw;
    height: 75vh;
    border-radius: 18px;
  }
}

/* Loading shimmer for lazy sections */
.category-section[data-loaded="false"] .carousel-track {
  min-height: 380px;
}
</style>
</head>

// ━━━━━━━━━━━━━ BUILD APP ━━━━━━━━━━━━━
const app = document.getElementById('app');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalClose = document.getElementById('modal-close');
const modalModel = document.getElementById('modal-model');
const bgOverlay = document.getElementById('bg-overlay');
const bgGlow = document.getElementById('bg-glow');

let activeCarousels = {};

function buildApp() {
  let html = '';
  menuData.forEach((cat) => {
    html += `<section class="category-section" data-cat-id="${cat.id}" data-bg="${cat.colors.bg}" data-glow="${cat.colors.glow}">
      <div class="category-header">
        <h2 class="category-title">${cat.name}</h2>
        <div class="category-subtitle">${cat.subtitle}</div>
      </div>
      <div class="carousel-wrapper">
        <button class="carousel-nav prev" data-cat="${cat.id}" aria-label="Previous">‹</button>
        <div class="carousel-track" data-cat-track="${cat.id}">`;
    
    cat.cards.forEach((card, idx) => {
      if (card.isAbout) {
        html += buildAboutCard(card, cat.id, idx);
      } else {
        html += buildMenuCard(card, cat.id, idx);
      }
    });
    
    html += `</div>
        <button class="carousel-nav next" data-cat="${cat.id}" aria-label="Next">›</button>
      </div>
      <div class="scroll-dots" data-dots="${cat.id}">`;
    cat.cards.forEach((_, idx) => {
      html += `<div class="scroll-dot${idx === 0 ? ' active' : ''}" data-dot-idx="${idx}"></div>`;
    });
    html += `</div></section>`;
  });
  app.innerHTML = html;
}

function buildMenuCard(card, catId, idx) {
  return `<div class="menu-card${idx === 0 ? ' active' : ''}" data-cat="${catId}" data-idx="${idx}" data-aura="${card.aura}" data-name="${card.name}">
    <div class="card-aura" style="background:${card.aura}"></div>
    <div class="card-border-glow"></div>
    <div class="card-title-3d">${card.name}</div>
    <div class="card-inner">
      <div class="card-bg" style="background:${card.gradient}"></div>
      <div class="card-glass"></div>
      <div class="card-shimmer"></div>
      <div class="card-content">
        <div class="card-title">${card.name}</div>
        <div class="card-desc">${card.desc}</div>
        <div class="card-price">Rs. ${card.price}</div>
      </div>
    </div>
  </div>`;
}

function buildAboutCard(card, catId, idx) {
  return `<div class="menu-card${idx === 0 ? ' active' : ''}" data-cat="${catId}" data-idx="${idx}" data-aura="${card.aura}" data-name="${card.name}" data-about-action="${card.action}">
    <div class="card-aura" style="background:${card.aura}"></div>
    <div class="card-border-glow"></div>
    <div class="card-title-3d">${card.label}</div>
    <div class="card-inner">
      <div class="card-bg" style="background:${card.gradient}"></div>
      <div class="card-glass"></div>
      <div class="card-shimmer"></div>
      <div class="card-content">
        <div class="about-card-icon">${card.icon}</div>
        <div class="about-card-label">${card.label}</div>
        <div class="about-card-value">${card.value}</div>
        <div class="card-desc" style="margin-top:10px">${card.desc}</div>
      </div>
    </div>
  </div>`;
}

// ━━━━━━━━━━━━━ CAROUSEL LOGIC ━━━━━━━━━━━━━
document.querySelectorAll('.carousel-track').forEach(track => {
  const catId = track.dataset.catTrack;
  let isDown = false, startX, scrollLeft;

  track.addEventListener('mousedown', (e) => {
    isDown = true;
    track.classList.add('grabbing');
    startX = e.pageX - track.offsetLeft;
    scrollLeft = track.scrollLeft;
  });

  track.addEventListener('mouseleave', () => {
    isDown = false;
    track.classList.remove('grabbing');
  });

  track.addEventListener('mouseup', () => {
    isDown = false;
    track.classList.remove('grabbing');
  });

  track.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - track.offsetLeft;
    const walk = (x - startX) * 1.5;
    track.scrollLeft = scrollLeft - walk;
  });

  track.addEventListener('scroll', () => {
    updateActiveCard(track, catId);
  });
});

function updateActiveCard(track, catId) {
  const cards = track.querySelectorAll('.menu-card');
  const trackRect = track.getBoundingClientRect();
  const trackCenter = trackRect.left + trackRect.width / 2;
  let closestCard = null;
  let closestDist = Infinity;

  cards.forEach(card => {
    const cardRect = card.getBoundingClientRect();
    const cardCenter = cardRect.left + cardRect.width / 2;
    const dist = Math.abs(cardCenter - trackCenter);
    if (dist < closestDist) {
      closestDist = dist;
      closestCard = card;
    }
  });

  cards.forEach(c => c.classList.remove('active'));
  if (closestCard) {
    closestCard.classList.add('active');
    const idx = parseInt(closestCard.dataset.idx);
    updateDots(catId, idx);
  }
}

function updateDots(catId, activeIdx) {
  const dotsContainer = document.querySelector(`[data-dots="${catId}"]`);
  if (!dotsContainer) return;
  dotsContainer.querySelectorAll('.scroll-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === activeIdx);
  });
}

// Nav buttons
document.querySelectorAll('.carousel-nav').forEach(btn => {
  btn.addEventListener('click', () => {
    const catId = btn.dataset.cat;
    const track = document.querySelector(`[data-cat-track="${catId}"]`);
    const cardWidth = track.querySelector('.menu-card')?.offsetWidth || 300;
    const scrollAmount = cardWidth + 30;
    
    if (btn.classList.contains('prev')) {
      track.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
    } else {
      track.scrollBy({ left: scrollAmount, behavior: 'smooth' });
    }
  });
});

// ━━━━━━━━━━━━━ DYNAMIC BACKGROUND ━━━━━━━━━━━━━
const sectionObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting && entry.intersectionRatio > 0.3) {
      const section = entry.target;
      const bg = section.dataset.bg;
      const glow = section.dataset.glow;

      // Find the active card in this section
      const activeCard = section.querySelector('.menu-card.active');
      if (activeCard) {
        const aura = activeCard.dataset.aura;
        bgGlow.style.background = aura;
        bgGlow.style.opacity = '0.15';
      }

      document.body.style.background = `linear-gradient(180deg, #0a0a0a 0%, ${bg} 50%, #0a0a0a 100%)`;
      bgOverlay.style.background = `radial-gradient(ellipse at center, ${bg} 0%, rgba(10,10,10,0.95) 70%, #0a0a0a 100%)`;
    }
  });
}, { threshold: [0.3, 0.5, 0.7] });

document.querySelectorAll('.category-section').forEach(section => {
  sectionObserver.observe(section);
});

// Update background based on active card scroll
const scrollObserver = new MutationObserver((mutations) => {
  mutations.forEach(mutation => {
    if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
      const card = mutation.target;
      if (card.classList.contains('active') && card.classList.contains('menu-card')) {
        const aura = card.dataset.aura;
        if (aura) {
          bgGlow.style.background = aura;
          bgGlow.style.opacity = '0.18';
        }
      }
    }
  });
});

document.querySelectorAll('.menu-card').forEach(card => {
  scrollObserver.observe(card, { attributes: true, attributeFilter: ['class'] });
});

// ━━━━━━━━━━━━━ CARD CLICK → MODAL ━━━━━━━━━━━━━
document.addEventListener('click', (e) => {
  const card = e.target.closest('.menu-card');
  if (!card) return;

  // Check if it's an about card
  const aboutAction = card.dataset.aboutAction;
  if (aboutAction) {
    window.open(aboutAction, '_blank');
    return;
  }

  // Open 3D model viewer modal
  const name = card.dataset.name;
  modalTitle.textContent = name;
  modalModel.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
});

modalClose.addEventListener('click', () => {
  modal.classList.remove('open');
  document.body.style.overflow = '';
});

modal.addEventListener('click', (e) => {
  if (e.target === modal) {
    modal.classList.remove('open');
    document.body.style.overflow = '';
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modal.classList.contains('open')) {
    modal.classList.remove('open');
    document.body.style.overflow = '';
  }
});

// ━━━━━━━━━━━━━ INITIAL SCROLL POSITION ━━━━━━━━━━━━━
// Center first card in each carousel
window.addEventListener('load', () => {
  document.querySelectorAll('.carousel-track').forEach(track => {
    const firstCard = track.querySelector('.menu-card');
    if (firstCard) {
      const trackWidth = track.offsetWidth;
      const cardWidth = firstCard.offsetWidth;
      const offset = (trackWidth - cardWidth) / 2;
      // Add padding for centering
      track.style.paddingLeft = `${Math.max(offset, 20)}px`;
      track.style.paddingRight = `${Math.max(offset, 20)}px`;
    }
  });
});
