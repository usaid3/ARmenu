*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

.logo-text {

.logo-tagline {

.logo-divider {

.app-container { position: relative; z-index: 1; padding: 10px 0 40px; }

.category-subtitle {

.carousel-track {

  cursor: grab; align-items: center; min-height: 400px;
}
.carousel-track::-webkit-scrollbar { display: none; }
.carousel-track.grabbing { cursor: grabbing; }

}
.carousel-nav.prev { left: 8px; }
.carousel-nav.next { right: 8px; }

@media (prefers-reduced-motion: reduce) {

const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalClose = document.getElementById('modal-close');
const modalModel = document.getElementById('modal-model');

const bgGlow = document.getElementById('bg-glow');

// ━━━━━━━ BUILD APP ━━━━━━━
function buildApp() {
  let h = '';
  menuData.forEach(cat => {
    h += `<section class="category-section" data-cat-id="${cat.id}" data-bg="${cat.colors.bg}" data-glow="${cat.colors.glow}">
      <div class="category-header"><h2 class="category-title">${cat.name}</h2><div class="category-subtitle">${cat.subtitle}</div></div>
      <div class="carousel-wrapper">
        <button class="carousel-nav prev" data-cat="${cat.id}" aria-label="Previous">‹</button>
        <div class="carousel-track" data-cat-track="${cat.id}">`;
    cat.cards.forEach((c, i) => { h += c.isAbout ? buildAbout(c, cat.id, i) : buildCard(c, cat.id, i); });
    h += `</div><button class="carousel-nav next" data-cat="${cat.id}" aria-label="Next">›</button></div>
      <div class="scroll-dots" data-dots="${cat.id}">`;
    cat.cards.forEach((_, i) => { h += `<div class="scroll-dot${i===0?' active':''}" data-dot-idx="${i}"></div>`; });
    h += `</div></section>`;
  });
  app.innerHTML = h;
}

// ━━━━━━━ BUILD REGULAR CARD ━━━━━━━
function buildCard(c, catId, i) {
  const m = c.model3d || "https://modelviewer.dev/shared-assets/models/Astronaut.glb";
  return `<div class="menu-card${i===0?' active':''}" data-cat="${catId}" data-idx="${i}" data-aura="${c.aura}" data-name="${c.name}" data-model="${m}">
    <div class="card-title-3d">${c.name}</div>
    <div class="card-inner">
      <div class="card-bg" style="background:${c.gradient}"></div>
      <div class="card-overlay"></div>
      <div class="card-shine"></div>
      <div class="card-content">
        <div class="card-title">${c.name}</div>
        <div class="card-desc">${c.desc}</div>
        <div class="card-price">Rs. ${c.price}</div>
      </div>
    </div>
  </div>`;
}

// ━━━━━━━ BUILD ABOUT CARD ━━━━━━━
function buildAbout(c, catId, i) {
  return `<div class="menu-card${i===0?' active':''}" data-cat="${catId}" data-idx="${i}" data-aura="${c.aura}" data-name="${c.name}" data-about-action="${c.action}">
    <div class="card-title-3d">${c.label}</div>
    <div class="card-inner">
      <div class="card-bg" style="background:${c.gradient}"></div>
      <div class="card-overlay"></div>
      <div class="card-shine"></div>
      <div class="card-content">
        <div class="about-card-icon">${c.icon}</div>
        <div class="about-card-label">${c.label}</div>
        <div class="about-card-value">${c.value}</div>
        <div class="card-desc" style="margin-top:8px">${c.desc}</div>
      </div>
    </div>
  </div>`;
}

buildApp();

// ━━━━━━━ CAROUSEL SYSTEM ━━━━━━━
document.querySelectorAll('.carousel-track').forEach(track => {
  let isDown=false, startX, scrollL;
  const catId = track.dataset.catTrack;
  track.addEventListener('mousedown', e => { isDown=true; track.classList.add('grabbing'); startX=e.pageX-track.offsetLeft; scrollL=track.scrollLeft; });
  track.addEventListener('mouseleave', () => { isDown=false; track.classList.remove('grabbing'); });
  track.addEventListener('mouseup', () => { isDown=false; track.classList.remove('grabbing'); });
  track.addEventListener('mousemove', e => { if(!isDown) return; e.preventDefault(); track.scrollLeft=scrollL-(e.pageX-track.offsetLeft-startX)*1.5; });
  let t;
  track.addEventListener('scroll', () => { clearTimeout(t); t=setTimeout(()=>updateActive(track,catId),80); }, {passive:true});
});

function updateActive(track, catId) {
  const cards=track.querySelectorAll('.menu-card');
  const center=track.getBoundingClientRect().left+track.getBoundingClientRect().width/2;
  let closest=null, min=Infinity;
  cards.forEach(c => { const d=Math.abs(c.getBoundingClientRect().left+c.getBoundingClientRect().width/2-center); if(d<min){min=d;closest=c;} });
  cards.forEach(c=>c.classList.remove('active'));
  if(closest){ closest.classList.add('active'); updateDots(catId,parseInt(closest.dataset.idx));
    const a=closest.dataset.aura; if(a) bgGlow.style.background=`radial-gradient(ellipse at center,${a} 0%,transparent 70%)`; }
}

function updateDots(catId,idx) {
  const d=document.querySelector(`[data-dots="${catId}"]`);
  if(!d) return; d.querySelectorAll('.scroll-dot').forEach((dot,i)=>dot.classList.toggle('active',i===idx));
}

// ━━━━━━━ NAV ARROWS ━━━━━━━
document.querySelectorAll('.carousel-nav').forEach(b => {
  b.addEventListener('click', () => {
    const t=document.querySelector(`[data-cat-track="${b.dataset.cat}"]`);
    const w=(t.querySelector('.menu-card')?.offsetWidth||280)+25;
    t.scrollBy({left:b.classList.contains('prev')?-w:w, behavior:'smooth'});
  });
});

// ━━━━━━━ DYNAMIC BACKGROUND ━━━━━━━
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{ if(e.isIntersecting&&e.intersectionRatio>0.3)
    bgOverlay.style.background=`radial-gradient(ellipse at center,${e.target.dataset.bg} 0%,rgba(8,8,8,0.95) 70%,#080808 100%)`; });
},{threshold:[0.3,0.5]});
document.querySelectorAll('.category-section').forEach(s=>obs.observe(s));

// ━━━━━━━ CARD CLICK → 3D MODEL or LINK ━━━━━━━
document.addEventListener('click', e => {
  const card=e.target.closest('.menu-card'); if(!card) return;
  const about=card.dataset.aboutAction;
  if(about){ window.open(about,'_blank'); return; }

  // 3D Model open karo
  const name=card.dataset.name;
  const modelUrl=card.dataset.model || "https://modelviewer.dev/shared-assets/models/Astronaut.glb";

  modalTitle.textContent=name;
  modalModel.setAttribute('src', modelUrl);  // ← YAHAN MODEL URL SET HOTA HAI
  modal.classList.add('open');
  document.body.style.overflow='hidden';
});

// ━━━━━━━ MODAL CLOSE ━━━━━━━
function closeModal(){ modal.classList.remove('open'); document.body.style.overflow=''; }
modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'&&modal.classList.contains('open')) closeModal(); });

// ━━━━━━━ CENTER FIRST CARDS ━━━━━━━
window.addEventListener('load', ()=>{
  document.querySelectorAll('.carousel-track').forEach(track=>{
    const card=track.querySelector('.menu-card');
    if(card){ const off=Math.max((track.offsetWidth-card.offsetWidth)/2,20);
      track.style.paddingLeft=off+'px'; track.style.paddingRight=off+'px'; }
  });
});
</script>
</body>
